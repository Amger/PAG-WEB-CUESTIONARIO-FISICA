                <div class="progress-track" aria-hidden="true">

                </div>

                <article id="question-container" class="question-container">
                    <p class="empty-state">Cargando preguntas...</p>
                </article>

                <footer class="quiz-actions">
                    <div class="nav-actions">
                        <button id="prev-button" class="secondary-button" type="button">Anterior</button>
                        <button id="next-button" class="secondary-button" type="button">Siguiente</button>
                    </div>

                    <div class="answer-actions">
                        <button id="check-button" class="primary-button" type="button">Enviar respuesta</button>
                    </div>
                </footer>

                <section id="feedback" class="feedback" aria-live="assertive"></section>
            </section>
        </section>
    </main>
