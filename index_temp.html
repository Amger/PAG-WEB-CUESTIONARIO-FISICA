<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Fisica</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="page">
        <section class="quiz-shell">
            <header class="hero">
                <p class="eyebrow">Cuestionario interactivo</p>
                <h1>Practica de Fisica</h1>
                <p class="hero-text">
                    Navega entre preguntas, responde en la misma pagina y comprueba al instante
                    si tu seleccion es correcta.
                </p>
                <div class="loader-panel">
                    <label class="file-loader" for="json-file-input">
                        Cargar JSON manualmente
                    </label>
                    <input id="json-file-input" type="file" accept=".json,application/json" hidden>
                    <p class="loader-help">
                        Si abres la pagina sin servidor local, puedes seleccionar aqui tu archivo
                        `preguntas.json`.
                    </p>
                </div>
            </header>

            <section class="quiz-card" aria-live="polite">
                <div class="quiz-meta">
                    <span id="question-counter">Pregunta 0 de 0</span>
                    <span id="question-mode" class="question-mode">Cargando...</span>
                </div>

                <div class="question-tabs" id="question-tabs"></div><div class="progress-track" aria-hidden="true">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <article id="question-container" class="question-container">
                    <p class="empty-state">Cargando preguntas...</p>
                </article>

                <footer class="quiz-actions">
                    <div class="nav-actions">
                        <button id="prev-button" class="secondary-button" type="button">Anterior</button>
                        <button id="next-button" class="secondary-button" type="button">Siguiente</button>
                    </div>

                    <div class="answer-actions">
                        <button id="check-button" class="primary-button" type="button">Enviar respuesta</button>
                    </div>
                </footer>

                <section id="feedback" class="feedback" aria-live="assertive"></section>
            </section>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
